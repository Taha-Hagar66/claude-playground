<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Board</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8e8ea; --muted:#8a8f98; --accent:#d97757; --ok:#5fb37a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text);
         display:flex; justify-content:center; padding:40px 16px; }
  main { width:100%; max-width:440px; display:grid; gap:20px; }
  h1 { margin:0; font-size:22px; } h1 span { color:var(--accent); }
  .card { background:var(--card); border-radius:14px; padding:20px; }
  .time { font-size:64px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; }
  .ring { height:6px; background:#2a2e38; border-radius:3px; overflow:hidden; margin:10px 0 16px; }
  .ring div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .row { display:flex; gap:8px; }
  button { flex:1; border:0; border-radius:10px; padding:10px; font-weight:600; cursor:pointer;
           background:#2a2e38; color:var(--text); }
  button.primary { background:var(--accent); color:#fff; }
  input { flex:1; border:1px solid #2a2e38; background:#0f1115; color:var(--text); border-radius:10px; padding:10px; }
  ul { list-style:none; padding:0; margin:14px 0 0; }
  li { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #23262e; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li span { flex:1; } li button { flex:0; padding:4px 10px; background:none; color:var(--muted); }
  .stats { color:var(--muted); font-size:14px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Focus <span>Board</span></h1>
  <section class="card">
    <div class="time" id="time">25:00</div>
    <div class="ring"><div id="bar"></div></div>
    <div class="row">
      <button class="primary" id="start">Start</button>
      <button id="reset">Reset</button>
      <button id="mode">Break mode</button>
    </div>
  </section>
  <section class="card">
    <form class="row" id="form"><input id="task" placeholder="What are you working on?"><button class="primary" style="flex:0 0 70px">Add</button></form>
    <ul id="list"></ul>
  </section>
  <div class="stats" id="stats"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let tasks = load('tasks', []), sessions = load('sessions', 0);
  let total = 25 * 60, left = total, timer = null, isBreak = false;

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  function draw() {
    $('time').textContent = fmt(left);
    $('bar').style.width = (100 * (1 - left / total)) + '%';
    document.title = timer ? `${fmt(left)} · Focus Board` : 'Focus Board';
    const done = tasks.filter(t => t.done).length;
    $('stats').textContent = `${sessions} focus session${sessions === 1 ? '' : 's'} completed · ${done}/${tasks.length} tasks done`;
  }
  function stop() { clearInterval(timer); timer = null; $('start').textContent = 'Start'; }
  $('start').onclick = () => {
    if (timer) return stop();
    $('start').textContent = 'Pause';
    timer = setInterval(() => {
      if (--left <= 0) {
        stop(); if (!isBreak) save('sessions', ++sessions);
        new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play().catch(()=>{});
        alert(isBreak ? 'Break over — back to it!' : 'Nice work! Take a break.');
        left = total;
      }
      draw();
    }, 1000);
  };
  $('reset').onclick = () => { stop(); left = total; draw(); };
  $('mode').onclick = () => {
    stop(); isBreak = !isBreak; total = (isBreak ? 5 : 25) * 60; left = total;
    $('mode').textContent = isBreak ? 'Focus mode' : 'Break mode'; draw();
  };

  function renderTasks() {
    $('list').innerHTML = '';
    tasks.forEach((t, i) => {
      const li = document.createElement('li'); if (t.done) li.className = 'done';
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', checked: t.done });
      cb.style.flex = '0';
      cb.onchange = () => { t.done = cb.checked; save('tasks', tasks); renderTasks(); };
      const span = document.createElement('span'); span.textContent = t.text;
      const del = document.createElement('button'); del.textContent = '✕';
      del.onclick = () => { tasks.splice(i, 1); save('tasks', tasks); renderTasks(); };
      li.append(cb, span, del); $('list').append(li);
    });
    draw();
  }
  $('form').onsubmit = e => {
    e.preventDefault(); const v = $('task').value.trim(); if (!v) return;
    tasks.push({ text: v, done: false }); save('tasks', tasks); $('task').value = ''; renderTasks();
  };
  renderTasks();
</script>
</body>
</html>
